<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Operasional Percetakan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <script>
      // URL Apps Script Anda
      const API_URL = "https://script.google.com/macros/s/AKfycbw1u9cDQdcmd7xmbfxa_D9y28YVFPy6G0hWNJTZvzcR1GTgtSWvCrgUAut9f51WlowP/exec";
    </script>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📦 Sistem Percetakan Sablon</span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-9">
                
                <!-- BAGIAN 1: FORM INPUT ORDER PO -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">📝 Input Order Pesanan Baru (PO)</h5>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Notifikasi Sukses / Gagal -->
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <form id="formPO">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label font-weight-bold">Tanggal Pesanan</label>
                                    <input type="date" class="form-control" id="tanggal" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">No. PO / Invoice</label>
                                    <input type="text" class="form-control" id="noPO" placeholder="Contoh: PO-001" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Nama Pelanggan</label>
                                    <input type="text" class="form-control" id="pelanggan" placeholder="Nama Pelanggan / Toko" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Bahan / Jenis Cup</label>
                                    <input type="text" class="form-control" id="bahan" placeholder="Contoh: Cup 16oz Oval" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Jumlah Order (Qty)</label>
                                    <input type="number" class="form-control" id="qty" placeholder="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Pekerja / Operator</label>
                                    <input type="text" class="form-control" id="pekerja" placeholder="Nama Pekerja" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Status Awal</label>
                                    <select class="form-select" id="status">
                                        <option value="Proses" selected>Proses</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Selesai">Selesai</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">

                            <button type="submit" id="btnSimpan" class="btn btn-primary w-100 py-2 fw-bold">
                                🚀 Simpan Order ke Database
                            </button>
                        </form>

                    </div>
                </div>

                <!-- BAGIAN 2: MONITORING STOK GUDANG -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold">📦 Monitoring Stok Gudang</h5>
                        <button onclick="loadStokData()" class="btn btn-sm btn-outline-primary fw-bold">
                            🔄 Refresh Stok
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">ID / Nama Bahan</th>
                                        <th class="text-end">Stok Awal</th>
                                        <th class="text-end">Terpakai</th>
                                        <th class="text-end pe-3">Sisa Stok</th>
                                    </tr>
                                </thead>
                                <tbody id="stok-body">
                                    <tr>
                                        <td colspan="4" class="text-center py-3 text-muted">Memuat data stok...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA PEMROSESAN DATA -->
    <script>
      // 1. Set tanggal default ke hari ini & Ambil Data Stok Pertama Kali
      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('tanggal').valueAsDate = new Date();
        loadStokData(); // Otomatis ambil data stok saat halaman dibuka
      });

      // 2. Fungsi Simpan Order PO ke Spreadsheet
      document.getElementById('formPO').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('btnSimpan');
        const alertBox = document.getElementById('alertBox');
        
        btn.disabled = true;
        btn.innerHTML = '⏳ Menyimpan data...';
        alertBox.classList.add('d-none');

        const payload = {
          tanggal: document.getElementById('tanggal').value,
          noPO: document.getElementById('noPO').value,
          pelanggan: document.getElementById('pelanggan').value,
          bahan: document.getElementById('bahan').value,
          qty: document.getElementById('qty').value,
          pekerja: document.getElementById('pekerja').value,
          status: document.getElementById('status').value
        };

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(res => {
          if(res.status === "success") {
            alertBox.className = "alert alert-success";
            alertBox.innerText = "✅ Data Order PO Berhasil Disimpan!";
            alertBox.classList.remove('d-none');
            
            // Reset form input
            document.getElementById('formPO').reset();
            document.getElementById('tanggal').valueAsDate = new Date();
            
            // Refresh tabel stok setelah input data baru
            loadStokData();
          } else {
            throw new Error(res.message);
          }
          btn.disabled = false;
          btn.innerHTML = '🚀 Simpan Order ke Database';
        })
        .catch(error => {
          alertBox.className = "alert alert-danger";
          alertBox.innerText = "❌ Gagal menyimpan data: " + error.message;
          alertBox.classList.remove('d-none');
          
          btn.disabled = false;
          btn.innerHTML = '🚀 Simpan Order ke Database';
        });
      });

      // 3. Fungsi Ambil Data Stok dari Apps Script (doGet)
      function loadStokData() {
        const tbody = document.getElementById("stok-body");
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-3 text-muted">🔄 Memuat data stok terbaru...</td></tr>';

        fetch(API_URL)
          .then(response => response.json())
          .then(res => {
            if (res.status === "success") {
              tbody.innerHTML = ""; 
              
              res.data.forEach(item => {
                const row = document.createElement("tr");
                
                // Beri penanda warna merah tebal jika sisa stok kurang dari 1.000 pcs
                const isCritical = item.sisaStok < 1000;
                const badgeStyle = isCritical 
                  ? 'class="text-end pe-3 fw-bold text-danger"' 
                  : 'class="text-end pe-3 fw-bold text-success"';

                row.innerHTML = `
                  <td class="ps-3 fw-semibold">${item.idBahan}</td>
                  <td class="text-end">${Number(item.stokAwal).toLocaleString('id-ID')}</td>
                  <td class="text-end text-muted">${Number(item.terpakai).toLocaleString('id-ID')}</td>
                  <td ${badgeStyle}>${Number(item.sisaStok).toLocaleString('id-ID')} Pcs</td>
                `;
                tbody.appendChild(row);
              });
            } else {
              tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-3">Gagal memuat stok: ${res.message}</td></tr>`;
            }
          })
          .catch(err => {
            console.error(err);
            tbody.innerHTML = '<tr><td colspan="4" class="text-center text-danger py-3">Gagal terhubung ke server database.</td></tr>';
          });
      }
    </script>
</body>
</html>
