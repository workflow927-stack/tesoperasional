<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Operasional Percetakan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <script>
      const API_URL = "https://script.google.com/macros/s/AKfycbw1u9cDQdcmd7xmbfxa_D9y28YVFPy6G0hWNJTZvzcR1GTgtSWvCrgUAut9f51WlowP/exec";
    </script>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📦 Sistem Percetakan Sablon</span>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <!-- BAGIAN 1: FORM INPUT ORDER PO -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0 fw-bold">📝 Input Order Pesanan Baru (PO)</h5>
                    </div>
                    <div class="card-body p-4">
                        <div id="alertBox" class="alert d-none" role="alert"></div>

                        <form id="formPO">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label font-weight-bold">Tanggal Pesanan</label>
                                    <input type="date" class="form-control" id="tanggal" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">No. PO / Invoice</label>
                                    <input type="text" class="form-control" id="noPO" placeholder="Contoh: PO-001" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Nama Pelanggan</label>
                                    <input type="text" class="form-control" id="pelanggan" placeholder="Nama Pelanggan / Toko" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Bahan / Jenis Cup</label>
                                    <input type="text" class="form-control" id="bahan" placeholder="Contoh: Cup 16oz Oval" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Jumlah Order (Qty)</label>
                                    <input type="number" class="form-control" id="qty" placeholder="0" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Pekerja / Operator</label>
                                    <input type="text" class="form-control" id="pekerja" placeholder="Nama Pekerja" required>
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Status Awal</label>
                                    <select class="form-select" id="status">
                                        <option value="Proses" selected>Proses</option>
                                        <option value="Pending">Pending</option>
                                        <option value="Selesai">Selesai</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4">

                            <button type="submit" id="btnSimpan" class="btn btn-primary w-100 py-2 fw-bold">
                                🚀 Simpan Order ke Database
                            </button>
                        </form>
                    </div>
                </div>

                <!-- BAGIAN 2: DAFTAR RIWAYAT ORDER PO & EDIT STATUS -->
                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0 fw-bold">📋 Riwayat Order PO</h5>
                        <button onclick="loadDashboardData()" class="btn btn-sm btn-outline-primary fw-bold">🔄 Refresh</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-3">No. PO</th>
                                        <th>Tanggal</th>
                                        <th>Pelanggan</th>
                                        <th>Bahan</th>
                                        <th class="text-end">Qty</th>
                                        <th>Pekerja</th>
                                        <th class="text-center pe-3">Status / Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="orders-body">
                                    <tr><td colspan="7" class="text-center py-3 text-muted">Memuat order...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- BAGIAN 3 & 4: MONITORING STOK & GAJI -->
                <div class="row">
                    <!-- MONITORING STOK -->
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0 fw-bold">📦 Stok Gudang</h5>
                                <button onclick="loadDashboardData()" class="btn btn-sm btn-outline-primary fw-bold">🔄 Refresh</button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th class="ps-3">Bahan</th>
                                                <th class="text-end">Stok</th>
                                                <th class="text-end pe-3">Sisa</th>
                                            </tr>
                                        </thead>
                                        <tbody id="stok-body">
                                            <tr><td colspan="3" class="text-center py-3 text-muted">Memuat stok...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- REKAP GAJI -->
                    <div class="col-md-6 mb-4">
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0 fw-bold">💰 Rekap Gaji Pekerja</h5>
                                <button onclick="loadDashboardData()" class="btn btn-sm btn-outline-primary fw-bold">🔄 Refresh</button>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                            <tr>
                                                <th class="ps-3">Nama Pekerja</th>
                                                <th class="text-end">Total Pcs</th>
                                                <th class="text-end pe-3">Total Upah</th>
                                            </tr>
                                        </thead>
                                        <tbody id="gaji-body">
                                            <tr><td colspan="3" class="text-center py-3 text-muted">Memuat data gaji...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA PEMROSESAN DATA -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('tanggal').valueAsDate = new Date();
        loadDashboardData();
      });

      // Submit Form PO Baru
      document.getElementById('formPO').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        const alertBox = document.getElementById('alertBox');
        
        btn.disabled = true;
        btn.innerHTML = '⏳ Menyimpan data...';
        alertBox.classList.add('d-none');

        const payload = {
          tanggal: document.getElementById('tanggal').value,
          noPO: document.getElementById('noPO').value,
          pelanggan: document.getElementById('pelanggan').value,
          bahan: document.getElementById('bahan').value,
          qty: document.getElementById('qty').value,
          pekerja: document.getElementById('pekerja').value,
          status: document.getElementById('status').value
        };

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(res => {
          if(res.status === "success") {
            alertBox.className = "alert alert-success";
            alertBox.innerText = "✅ Data Order PO Berhasil Disimpan!";
            alertBox.classList.remove('d-none');
            
            document.getElementById('formPO').reset();
            document.getElementById('tanggal').valueAsDate = new Date();
            loadDashboardData();
          } else { throw new Error(res.message); }
          btn.disabled = false;
          btn.innerHTML = '🚀 Simpan Order ke Database';
        })
        .catch(error => {
          alertBox.className = "alert alert-danger";
          alertBox.innerText = "❌ Gagal menyimpan data: " + error.message;
          alertBox.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '🚀 Simpan Order ke Database';
        });
      });

      // Ambil Semua Data Dashboard (PO, Stok, Gaji)
      function loadDashboardData() {
        const tbodyOrders = document.getElementById("orders-body");
        const tbodyStok = document.getElementById("stok-body");
        const tbodyGaji = document.getElementById("gaji-body");
        
        tbodyOrders.innerHTML = '<tr><td colspan="7" class="text-center py-3 text-muted">🔄 Memuat data...</td></tr>';
        tbodyStok.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-muted">🔄 Memuat...</td></tr>';
        tbodyGaji.innerHTML = '<tr><td colspan="3" class="text-center py-3 text-muted">🔄 Memuat...</td></tr>';

        fetch(API_URL)
          .then(response => response.json())
          .then(res => {
            if (res.status === "success") {
              
              // 1. Render Tabel Riwayat PO
              tbodyOrders.innerHTML = "";
              if (res.orders.length === 0) {
                tbodyOrders.innerHTML = '<tr><td colspan="7" class="text-center py-3 text-muted">Belum ada order.</td></tr>';
              } else {
                // Tampilkan order terbaru di paling atas
                res.orders.reverse().forEach(ord => {
                  const row = document.createElement("tr");
                  
                  // Warna Badge Status
                  let badgeClass = "bg-warning text-dark";
                  if (ord.status === "Selesai") badgeClass = "bg-success";
                  if (ord.status === "Pending") badgeClass = "bg-secondary";

                  row.innerHTML = `
                    <td class="ps-3 fw-bold">${ord.noPO}</td>
                    <td>${ord.tanggal}</td>
                    <td>${ord.pelanggan}</td>
                    <td>${ord.bahan}</td>
                    <td class="text-end fw-semibold">${Number(ord.qty).toLocaleString('id-ID')}</td>
                    <td>${ord.pekerja}</td>
                    <td class="text-center pe-3">
                      <select class="form-select form-select-sm d-inline-block w-auto" onchange="updateStatus(${ord.rowNum}, this.value)">
                        <option value="Proses" ${ord.status === 'Proses' ? 'selected' : ''}>Proses</option>
                        <option value="Pending" ${ord.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="Selesai" ${ord.status === 'Selesai' ? 'selected' : ''}>Selesai</option>
                      </select>
                    </td>
                  `;
                  tbodyOrders.appendChild(row);
                });
              }

              // 2. Render Tabel Stok
              tbodyStok.innerHTML = "";
              res.stok.forEach(item => {
                const row = document.createElement("tr");
                const isCritical = item.sisaStok < 1000;
                const badgeStyle = isCritical ? 'class="text-end pe-3 fw-bold text-danger"' : 'class="text-end pe-3 fw-bold text-success"';

                row.innerHTML = `
                  <td class="ps-3 fw-semibold">${item.idBahan}</td>
                  <td class="text-end text-muted">${Number(item.stokAwal).toLocaleString('id-ID')}</td>
                  <td ${badgeStyle}>${Number(item.sisaStok).toLocaleString('id-ID')}</td>
                `;
                tbodyStok.appendChild(row);
              });

              // 3. Render Tabel Gaji
              tbodyGaji.innerHTML = "";
              res.gaji.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `
                  <td class="ps-3 fw-semibold">${item.namaPekerja}</td>
                  <td class="text-end">${Number(item.totalQty).toLocaleString('id-ID')} pcs</td>
                  <td class="text-end pe-3 fw-bold text-primary">Rp ${Number(item.totalGaji).toLocaleString('id-ID')}</td>
                `;
                tbodyGaji.appendChild(row);
              });

            } else {
              tbodyOrders.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-3">Gagal: ${res.message}</td></tr>`;
            }
          })
          .catch(err => {
            console.error(err);
            tbodyOrders.innerHTML = '<tr><td colspan="7" class="text-center text-danger py-3">Gagal koneksi server.</td></tr>';
          });
      }

      // Fungsi Ubah Status Order
      function updateStatus(rowNum, newStatus) {
        const payload = {
          action: "updateStatus",
          rowNum: rowNum,
          newStatus: newStatus
        };

        fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          if (res.status === "success") {
            // Refresh data agar rekap stok/gaji ikut ter-update
            loadDashboardData();
          } else {
            alert("Gagal mengubah status: " + res.message);
          }
        })
        .catch(err => alert("Terjadi kesalahan koneksi."));
      }
    </script>
</body>
</html>
